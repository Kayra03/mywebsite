<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">   
                <div class="logo">
                <img src="img/logo.jpeg" alt="Ryomen Sukuna Logo" width="100" height="100">
            </div>


            <h1>Ryomen Sukuna</h1>
            <nav>
                <ul>
                    <li><a href="anasayfa.html"><i class="fas fa-home"></i> Ana Sayfa</a></li>
                    <li><a href="gucler.html"><i class="fas fa-bolt"></i> Güçleri</a></li>
                    <li><a href="galeri.html"><i class="fas fa-images"></i> Galeri</a></li>
                    <li><a href="sozler.html"><i class="fas fa-quote-right"></i> Sözleri</a></li>
                    <li><a href="iletisim.html"><i class="fas fa-envelope"></i> İletişim</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="contact-section">
        <div class="container">
            <h2>Bize Ulaşın</h2>
            <p>Mesajınızı iletmek için aşağıdaki formu doldurun.</p>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="isim"><i class="fas fa-user"></i> Adınız:</label>
                    <input type="text" id="isim" name="isim" required>
                </div>

                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> E-posta:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="mesaj"><i class="fas fa-comment"></i> Mesajınız:</label>
                    <textarea id="mesaj" name="mesaj" rows="5" required></textarea>
                </div>

                <button type="submit" class="btn"><i class="fas fa-paper-plane"></i> Gönder</button>
            </form>
        </div>

        <div class="contact-container">
            <img src="img/chibi.jpg" alt="Sukuna İletişim" class="contact-image">
             <div class="sukuna-message">
            <h3>"İletişime geçin,gücünüzün farkında olun!"</h3>
            <p>Geri bildirim için  lütfen mesajınızı bırakın.</p>
        </div>
        </div>

       

    </section>
</body>
</html>
